# Lefthook configuration file (https://lefthook.dev)

pre-commit:
  parallel: true
  commands:
    fmt-prettier:
      glob: "*.{js,ts,json,md,yml,yaml}"
      exclude:
        - "pkg/**/*.md"
      run: mise run format-prettier -- {staged_files}
      stage_fixed: true

    check-typos:
      exclude:
        - "pkg/**/*.md"
      run: mise run check-typos -- {staged_files}
      file_types: text

    check-secrets:
      exclude:
        - "pkg/**/*.md"
      run: mise run check-secrets

    check-links:
      glob: "*.md"
      exclude:
        - "pkg/**/*.md"
        - "CHANGELOG.md"
      run: mise run check-links -- {staged_files}

    # all other pre-commit tasks need to be run in sequence
    pre-commit-serial:
      run: lefthook run pre-commit-serial
      env:
        LEFTHOOK_QUIET: execution_info,meta,skips,summary

# called by `pre-commit`
pre-commit-serial:
  parallel: false
  commands:
    generate:
      run: mise run generate

    check-mod-change:
      run: mise run mod-tidy

    fmt:
      glob: "*.go"
      run: mise run format
      stage_fixed: true

    docs:
      glob: "*.go"
      run: mise run docs-make
      stage_fixed: true

pre-push:
  follow: true
  piped: true
  commands:
    tests:
      glob: "*.go"
      run: mise run test
